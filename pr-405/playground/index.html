<!DOCTYPE html><html lang="en"><head><meta charSet="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><link rel="stylesheet" type="text/css" href="https://shelving.cc/pr-405/client-jqdn3xzw.css" data-precedence="default"/><script type="module" src="https://shelving.cc/pr-405/client-8t7mz5yz.js" async=""></script><title>Shelving</title><title>Playground - Shelving</title><meta name="description" content="TypeScript data toolkit"/><base href="https://shelving.cc/pr-405/"/></head><body><div class="playground_lxwgOg"><div class="editor_lxwgOg"><div class="block_3K4IUA left_dKRqQA flex_bN4Hsg left_bN4Hsg"><a href="https://shelving.cc/pr-405/" class="block_3K4IUA button_SGK8Zw plain_SGK8Zw small_SGK8Zw flex_bN4Hsg"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" data-slot="icon"><path fill-rule="evenodd" d="M7.72 12.53a.75.75 0 0 1 0-1.06l7.5-7.5a.75.75 0 1 1 1.06 1.06L9.31 12l6.97 6.97a.75.75 0 1 1-1.06 1.06l-7.5-7.5Z" clip-rule="evenodd"></path></svg>Home</a></div><div class="block_3K4IUA left_dKRqQA wrap_dKRqQA flex_bN4Hsg left_bN4Hsg wrap_bN4Hsg"><button type="button" aria-pressed="true" class="block_3K4IUA button_SGK8Zw small_SGK8Zw flex_bN4Hsg">TSX</button><button type="button" aria-pressed="false" class="block_3K4IUA button_SGK8Zw small_SGK8Zw unselected_SGK8Zw flex_bN4Hsg">CSS</button><button type="button" class="block_3K4IUA button_SGK8Zw small_SGK8Zw solid_SGK8Zw flex_bN4Hsg"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" data-slot="icon"><path fill-rule="evenodd" d="M12 3.75a.75.75 0 0 1 .75.75v6.75h6.75a.75.75 0 0 1 0 1.5h-6.75v6.75a.75.75 0 0 1-1.5 0v-6.75H4.5a.75.75 0 0 1 0-1.5h6.75V4.5a.75.75 0 0 1 .75-.75Z" clip-rule="evenodd"></path></svg>Insert</button><button type="button" class="block_3K4IUA button_SGK8Zw small_SGK8Zw outline_SGK8Zw flex_bN4Hsg">Copy link</button><button type="button" class="block_3K4IUA button_SGK8Zw small_SGK8Zw plain_SGK8Zw flex_bN4Hsg">Reset</button></div><textarea name="code" minLength="0" rows="16" style="--input-rows:16" placeholder="TSX" class="block_3K4IUA font-code_dKRqQA input_temKoQ text_temKoQ multiline_temKoQ" title="" aria-invalid="false">import { useState } from &quot;react&quot;;
import { DATA, EMAIL, BOOLEAN, StringSchema } from &quot;shelving/schema&quot;;
import {
  Block, Button, Card, Definitions, Details, Form, Grid, Heading, Notice,
  Panel, Paragraph, Row, Subheading, Table, Tag, Title,
} from &quot;shelving/ui&quot;;

const SIGNUP = DATA({
  name: new StringSchema({ title: &quot;Name&quot;, min: 1, max: 60 }),
  email: EMAIL,
  updates: BOOLEAN,
});

function Counter() {
  const [count, setCount] = useState(0);
  return (
    &lt;Row left&gt;
      &lt;Button solid onClick={() =&gt; setCount(count + 1)}&gt;Liked {count} times&lt;/Button&gt;
      &lt;Button outline onClick={() =&gt; setCount(0)}&gt;Reset&lt;/Button&gt;
    &lt;/Row&gt;
  );
}

&lt;Panel color=&quot;primary&quot; padding=&quot;large&quot;&gt;
  &lt;Block width=&quot;narrow&quot;&gt;
    &lt;Title&gt;Shelving playground&lt;/Title&gt;
    &lt;Paragraph&gt;Edit the TSX or the CSS on the left. The preview updates as you type.&lt;/Paragraph&gt;
    &lt;Counter /&gt;
  &lt;/Block&gt;
&lt;/Panel&gt;

&lt;Block width=&quot;wide&quot; padding=&quot;large&quot;&gt;
  &lt;Heading&gt;Projects&lt;/Heading&gt;
  &lt;Grid columns={3} gap=&quot;small&quot;&gt;
    &lt;Card&gt;
      &lt;Subheading&gt;Trail log&lt;/Subheading&gt;
      &lt;Paragraph&gt;Record runs and rides offline, then sync.&lt;/Paragraph&gt;
      &lt;Tag status=&quot;success&quot;&gt;Live&lt;/Tag&gt;
    &lt;/Card&gt;
    &lt;Card&gt;
      &lt;Subheading&gt;Recipe box&lt;/Subheading&gt;
      &lt;Paragraph&gt;Shared shopping lists for the whole house.&lt;/Paragraph&gt;
      &lt;Tag status=&quot;warning&quot;&gt;Beta&lt;/Tag&gt;
    &lt;/Card&gt;
    &lt;Card&gt;
      &lt;Subheading&gt;Tide tables&lt;/Subheading&gt;
      &lt;Paragraph&gt;Local tide times, with alerts for low water.&lt;/Paragraph&gt;
      &lt;Tag&gt;Draft&lt;/Tag&gt;
    &lt;/Card&gt;
  &lt;/Grid&gt;
&lt;/Block&gt;

&lt;Panel padding=&quot;large&quot;&gt;
  &lt;Block width=&quot;narrow&quot;&gt;
    &lt;Heading&gt;Team&lt;/Heading&gt;
    &lt;Table&gt;
      &lt;thead&gt;
        &lt;tr&gt;&lt;th&gt;Name&lt;/th&gt;&lt;th&gt;Role&lt;/th&gt;&lt;th&gt;Plan&lt;/th&gt;&lt;/tr&gt;
      &lt;/thead&gt;
      &lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;Alice&lt;/td&gt;&lt;td&gt;Owner&lt;/td&gt;&lt;td&gt;Pro&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Bob&lt;/td&gt;&lt;td&gt;Editor&lt;/td&gt;&lt;td&gt;Free&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Chloe&lt;/td&gt;&lt;td&gt;Viewer&lt;/td&gt;&lt;td&gt;Free&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;
    &lt;/Table&gt;
    &lt;Definitions&gt;
      &lt;dt&gt;Created&lt;/dt&gt;&lt;dd&gt;3 March 2026&lt;/dd&gt;
      &lt;dt&gt;Storage&lt;/dt&gt;&lt;dd&gt;2.4 GB of 10 GB&lt;/dd&gt;
    &lt;/Definitions&gt;
    &lt;Notice status=&quot;warning&quot;&gt;Code can import from shelving, react, and react-dom only.&lt;/Notice&gt;
  &lt;/Block&gt;
&lt;/Panel&gt;

&lt;Block width=&quot;narrow&quot; padding=&quot;large&quot;&gt;
  &lt;Heading&gt;Join the beta&lt;/Heading&gt;
  &lt;Card&gt;
    &lt;Form schema={SIGNUP} submit=&quot;Sign up&quot; onSubmit={data =&gt; `Thanks, ${data.name}!`} /&gt;
  &lt;/Card&gt;
  &lt;Details title=&quot;What can I change?&quot;&gt;
    &lt;Paragraph&gt;Press Insert to add a component to the TSX, or a variable to the CSS.&lt;/Paragraph&gt;
  &lt;/Details&gt;
&lt;/Block&gt;
