# Run `bun run fix` on any push or pull request — if changes were made and the tests pass, commit the changes back.
# Also runs the three backend service suites as parallel jobs, so every PR proves the Firebase, PostgreSQL and Cloudflare D1 providers.
# On `main`, a successful run starts the `Release` workflow (see `release.yaml`), so these checks run once per push, not twice.
name: Fix
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"
  workflow_dispatch:
jobs:
  fix:
    name: Fix
    runs-on: ubuntu-latest
    steps:
      # Check out the PR head ref so the auto-commit can push back to the branch.
      # On push to main, github.head_ref is empty so checkout falls back to the default.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      # Pin the Bun version to the `engines.bun` range in `package.json`, so CI, the
      # release build and local development all agree on one floor.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: install
        run: bun install
      - name: fix
        run: bun run fix
      - name: test
        run: bun run test
      - name: git config
        env:
          BOT_USER_NAME: ${{ vars.BOT_USER_NAME }}
          BOT_USER_ID: ${{ vars.BOT_USER_ID }}
          BOT_PUBLIC_KEY: ${{ vars.BOT_PUBLIC_KEY }}
          BOT_PRIVATE_KEY: ${{ secrets.BOT_PRIVATE_KEY }}
        run: |
          mkdir ~/.ssh
          install -m 600 <(echo "$BOT_PUBLIC_KEY") ~/.ssh/git.pub
          install -m 600 <(echo "$BOT_PRIVATE_KEY") ~/.ssh/git
          eval `ssh-agent -s`
          ssh-add ~/.ssh/git
          git config user.name "${BOT_USER_NAME}"
          git config user.email "${BOT_USER_ID}+${BOT_USER_NAME}@users.noreply.github.com"
          git config --global gpg.format ssh
          git config --global user.signingkey ~/.ssh/git.pub
          git config --global commit.gpgsign true
      - name: git commit
        run: |
          git commit -am "style: Fix" && git push || echo "Nothing to commit"
  firebase:
    name: Firebase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      # Pin the Bun version to the `engines.bun` range in `package.json`, so CI, the
      # release build and local development all agree on one floor.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: ./.github/actions/firestore-emulator
      - name: install
        run: bun install
      # `bun run firebase` starts the emulator through firebase-tools. Here the emulator already runs (see above).
      - name: firebase
        run: bun test ./modules/firebase
  postgres:
    name: PostgreSQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      # Pin the Bun version to the `engines.bun` range in `package.json`, so CI, the
      # release build and local development all agree on one floor.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # The runner image has PostgreSQL installed but stopped. Starting it takes about 2 seconds, where a
      # `postgres` service container took 11 to 15 seconds to pull and start.
      - name: start postgres
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -q -c "ALTER USER postgres PASSWORD 'postgres';"
      - name: install
        run: bun install
      - name: postgres
        run: bun run postgres
  cloudflare:
    name: Cloudflare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      # Pin the Bun version to the `engines.bun` range in `package.json`, so CI, the
      # release build and local development all agree on one floor.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: install
        run: bun install
      # Miniflare (a dev dependency) runs the real D1 engine in `workerd`, so this job needs no other setup.
      - name: cloudflare
        run: bun run cloudflare
