# Runs Semantic Release after the `Fix` workflow passes on a push to the main branch.
# `Fix` already runs the core checks and both backend service suites, so this workflow does not run them again.
name: Release
on:
  workflow_run:
    workflows: [Fix]
    types: [completed]
    branches: [main]
  workflow_dispatch:
concurrency:
  group: release-main
  cancel-in-progress: true
jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # Release only after a passing `Fix` run for a push (not a pull request), or when started by hand.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      # Check out the commit that `Fix` tested. If `main` moved on since then, semantic-release sees that the
      # commit is not the branch head and skips the release; the newer commit's own `Fix` run releases it.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 26
      # Pin the Bun version to the `engines.bun` range in `package.json`, so CI, the
      # release build and local development all agree on one floor.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: install
        run: bun install
      - name: build
        run: bun run build
      - name: git config
        env:
          BOT_USER_NAME: ${{ vars.BOT_USER_NAME }}
          BOT_USER_ID: ${{ vars.BOT_USER_ID }}
          BOT_PUBLIC_KEY: ${{ vars.BOT_PUBLIC_KEY }}
          BOT_PRIVATE_KEY: ${{ secrets.BOT_PRIVATE_KEY }}
        run: |
          mkdir ~/.ssh
          install -m 600 <(echo "$BOT_PUBLIC_KEY") ~/.ssh/git.pub
          install -m 600 <(echo "$BOT_PRIVATE_KEY") ~/.ssh/git
          eval `ssh-agent -s`
          ssh-add ~/.ssh/git
          git config user.name "${BOT_USER_NAME}"
          git config user.email "${BOT_USER_ID}+${BOT_USER_NAME}@users.noreply.github.com"
          git config --global gpg.format ssh
          git config --global user.signingkey ~/.ssh/git.pub
          git config --global commit.gpgsign true
      # semantic-release needs the full history of `main` and its tags. Fetch only those: `fetch-depth: 0` on the
      # checkout fetched every branch, and the `docs` branch (every docs deploy and PR preview) took about 55 seconds.
      - name: fetch
        run: git fetch --unshallow --tags origin main
      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bunx semantic-release
