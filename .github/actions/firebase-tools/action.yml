# firebase-tools and the Firestore emulator, both from the cache, with `firebase` on PATH.
# `bunx firebase-tools` installed about 2000 packages and downloaded the emulator JAR on every run (about 20 seconds).
# A cached `npm install` folder restores in a few seconds. A PR can only restore caches from its own runs or from `main`,
# so the `Fix` run on each push to `main` saves the keys for every PR.
# To update firebase-tools, change the version here only.

name: firebase-tools
description: Restore or install firebase-tools and the Firestore emulator, and put `firebase` on PATH.

runs:
  using: composite
  steps:
    - uses: actions/cache@v5
      id: cache
      with:
        path: ~/firebase-tools
        key: firebase-tools-${{ runner.os }}-15.37.0
    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: npm install --prefix ~/firebase-tools --no-audit --no-fund --loglevel=error firebase-tools@15.37.0
    - shell: bash
      run: echo "$HOME/firebase-tools/node_modules/.bin" >> "$GITHUB_PATH"
    # firebase-tools downloads the emulator JAR here when it is missing. The JAR version follows the firebase-tools version.
    - uses: actions/cache@v5
      with:
        path: ~/.cache/firebase/emulators
        key: firebase-emulators-${{ runner.os }}-15.37.0
