# Start the Firestore emulator JAR directly, from the cache, and set `FIRESTORE_EMULATOR_HOST`.
# firebase-tools only downloads and starts this JAR, but it is about 2000 packages and takes seconds to restore and load.
# The JAR alone is ready about 1 second after it starts. A PR can only restore caches from its own runs or from `main`,
# so the `Fix` run on each push to `main` saves the key for every PR.
# To update the emulator, change the version here only. firebase-tools lists the current version in
# `lib/emulator/downloadableEmulatorInfo.json` (`firestore.version`).

name: firestore-emulator
description: Start the Firestore emulator on 127.0.0.1:8080 and set FIRESTORE_EMULATOR_HOST.

runs:
  using: composite
  steps:
    - uses: actions/cache@v5
      id: cache
      with:
        path: ~/firestore-emulator.jar
        key: firestore-emulator-1.22.0
    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: curl -fsSL -o ~/firestore-emulator.jar https://storage.googleapis.com/firebase-preview-drop/emulator/cloud-firestore-emulator-v1.22.0.jar
    - shell: bash
      run: |
        java -jar ~/firestore-emulator.jar --host=127.0.0.1 --port=8080 > "${RUNNER_TEMP}/firestore-emulator.log" 2>&1 &
        for attempt in $(seq 100); do
          if curl -sf http://127.0.0.1:8080/ > /dev/null; then
            echo "FIRESTORE_EMULATOR_HOST=127.0.0.1:8080" >> "$GITHUB_ENV"
            exit 0
          fi
          sleep 0.2
        done
        cat "${RUNNER_TEMP}/firestore-emulator.log"
        echo "::error::The Firestore emulator did not start in 20 seconds."
        exit 1
